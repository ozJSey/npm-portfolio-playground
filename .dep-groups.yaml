# Dependency Groups Configuration
# Define shared dependency sets and reference them in package.json via "depGroups"

groups:
  # Root group: for workspace root package.json only
  root:
    devDependencies:
      esbuild: "^0.25.12"

  live-editor:
    devDependencies:
      "@codemirror/autocomplete": "^6.20.0"
      "@codemirror/commands": "^6.10.0"
      "@codemirror/lang-vue": "^0.1.3"
      "@codemirror/language": "^6.12.0"
      "@codemirror/lint": "^6.8.0"
      "@codemirror/search": "^6.5.0"
      "@codemirror/state": "^6.7.0"
      "@codemirror/theme-one-dark": "^6.1.2"
      "@codemirror/view": "^6.43.0"
      "@lezer/common": "^1.2.3"
      "@lezer/highlight": "^1.2.1"
      "@lezer/lr": "^1.4.2"
      codemirror: "^6.0.1"
      sucrase: "^3.35.1"

  portfolio-packages:
    dependencies:
      "@ozjsey/bigdecimal-string": "1.2.1"
      "@ozjsey/dependency-grouper": "0.3.6"
      "@ozjsey/v-copy": "1.2.2"
      "@ozjsey/v-dropzone": "0.1.2"
      "@ozjsey/v-fit-children": "2.3.1"
      "@ozjsey/v-keyboard-navigation": "0.3.0"
      "@ozjsey/v-observe": "0.2.1"
      "@ozjsey/v-scroll-into-view": "1.3.3"
      "@ozjsey/v-select-text": "1.0.3"
      "@ozjsey/v-teleport-to": "1.1.4"
      "@ozjsey/vue-write-behind": "0.2.0"

  vue-app-tooling:
    devDependencies:
      "@types/node": "^26.2.0"
      "@vitejs/plugin-vue": "^5.2.1"
      typescript: "^5.7.0"
      vite: "^6.0.0"
      vue-tsc: "^2.2.0"

  vue-runtime:
    dependencies:
      vue: "3.5.43"
