# Dependency groups for the playground.
#
# Managed by @ozjsey/dependency-grouper — this repo's own tool, dogfooded here.
# Regenerate with:  pnpm deps      (== dependency-grouper generate)
#
# Every dependency of playground/package.json belongs to exactly one group
# below, which is what keeps the auto-managed "standalone" bucket empty.
groups:
  # The published portfolio packages the demo cards import. `dev` aliases these
  # to the sibling sources (vite.config.ts); `dev:dist` and the deployed build
  # resolve them from npm, which is why they are real dependencies.
  portfolio-packages:
    dependencies:
      "@ozjsey/bigdecimal-string": "^1.1.0"
      "@ozjsey/dependency-grouper": "^0.3.5"
      "@ozjsey/v-copy": "^1.1.0"
      "@ozjsey/v-dropzone": "^0.1.0"
      "@ozjsey/v-fit-children": "^2.2.0"
      "@ozjsey/v-keyboard-navigation": "^0.1.0"
      "@ozjsey/v-observe": "^0.1.0"
      "@ozjsey/v-scroll-into-view": "^1.2.0"
      "@ozjsey/v-select-text": "^2.1.0"
      "@ozjsey/v-teleport-to": "^3.0.0"
      "@ozjsey/vue-write-behind": "^0.1.0"

  # The framework the app itself renders with.
  vue-runtime:
    dependencies:
      vue: "^3.5.13"

  # Build + typecheck toolchain.
  vue-app-tooling:
    devDependencies:
      "@types/node": "^26.2.0"
      "@vitejs/plugin-vue": "^5.2.1"
      typescript: "^5.7.0"
      vite: "^6.0.0"
      vue-tsc: "^2.2.0"

  # The in-browser "Edit code" stack: CodeMirror plus the SFC transpiler that
  # recompiles a demo as you type.
  live-editor:
    devDependencies:
      "@codemirror/autocomplete": "^6.20.0"
      "@codemirror/commands": "^6.10.0"
      "@codemirror/lang-vue": "^0.1.3"
      "@codemirror/language": "^6.12.0"
      "@codemirror/lint": "^6.8.0"
      "@codemirror/search": "^6.5.0"
      "@codemirror/state": "^6.7.0"
      "@codemirror/theme-one-dark": "^6.1.2"
      "@codemirror/view": "^6.43.0"
      "@lezer/common": "^1.2.3"
      "@lezer/highlight": "^1.2.1"
      "@lezer/lr": "^1.4.2"
      codemirror: "^6.0.1"
      sucrase: "^3.35.1"
