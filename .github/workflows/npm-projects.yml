name: Test npm projects

on:
  schedule:
    # Fetch and test every portfolio package five times per day.
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@ozjsey/dependency-grouper'
            repository: ozjsey/dependency-grouper
          - package: '@ozjsey/bigdecimal-string'
            repository: ozjsey/big_decimal_string
          - package: '@ozjsey/vue-write-behind'
            repository: ozjsey/vue-write-behind
          - package: '@ozjsey/v-copy'
            repository: ozjsey/v-copy
          - package: '@ozjsey/v-fit-children'
            repository: ozjsey/vue-fit-children
          - package: '@ozjsey/v-keyboard-navigation'
            repository: ozjsey/v-keyboard-navigation
          - package: '@ozjsey/v-observe'
            repository: ozjsey/v-observe
          - package: '@ozjsey/v-scroll-into-view'
            repository: ozjsey/v-scroll-into-view
          - package: '@ozjsey/v-select-text'
            repository: ozjsey/v-select-text
          - package: '@ozjsey/v-teleport-to'
            repository: ozjsey/v-teleport-to
          - package: '@ozjsey/v-dropzone'
            repository: ozjsey/v-dropzone
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm view "${{ matrix.package }}@latest" version
      - run: npm pack "${{ matrix.package }}@latest" --dry-run
      # Audit the published runtime dependency surface. The checked-out
      # projects' dev toolchains are not part of the npm package consumers get.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test --if-present
