name: Publish playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    env:
      PLAYGROUND_USE_NPM: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm refresh:npm
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: pnpm install --frozen-lockfile
      # DOCS-6 shipped to production through this workflow, which built and
      # deployed with nothing checked at all. These two are the cheapest checks
      # that would have stopped it: one renders every README without a browser,
      # the other builds this repository alone and opens every documentation
      # tab in one. Together about twenty seconds against a broken docs site.
      - run: pnpm markdown
      - run: pnpm docs:ci
      # PG-26. Asserts every library reaches the BROWSER as ESM, under npm
      # resolution. A stale CI-only alias sent the CJS build of
      # bigdecimal-string to the browser and took eleven demos down on the
      # live site; smoke passed throughout, because it aliases to source.
      - run: pnpm modules
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
