name: Daily portfolio refresh

on:
  schedule:
    # Run the npm-backed playground checks three times per day.
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is declared PER JOB, not for the workflow, and that distinction is
# the whole point.
#
# This workflow used to sit in the `pages` group as a whole, to stop a scheduled
# run and a push handing GitHub Pages two different builds at once. But
# `pages.yml` declares the same group with `cancel-in-progress: true`, so every
# push to main killed whatever verification was in flight. Measured on
# 2026-09-20: dispatched runs at 10:14:50 and 10:18:32 were both cancelled
# moments before push-triggered Pages runs at 10:16:19 and 10:34:42 — 28 minutes
# of checks thrown away each time, and the run reported "cancelled", which reads
# like somebody pressed a button rather than like a config collision.
#
# So only the DEPLOY job belongs in `pages`; the verification does not deploy
# anything and has no business being cancellable by an unrelated push.

jobs:
  verify-npm:
    # Its own group: two verifications at once would only fight over the box,
    # but a queued one must WAIT rather than kill the running one.
    concurrency:
      group: verify-npm
      cancel-in-progress: false
    env:
      PLAYGROUND_USE_NPM: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm refresh:npm
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:npm
      - run: pnpm audit:npm
      - run: pnpm typecheck
      # DOCS-6. `markdown` needs no browser and catches a renderer that cannot
      # terminate, so it runs before anything launches Chrome. `docs:ci` builds
      # this repository alone and asserts every documentation tab renders a
      # published README — the check that was missing while all ten of them
      # showed an error banner on the live site. `tabs` drives both tab strips
      # with real keys.
      - run: pnpm markdown
      - run: pnpm build
      - run: pnpm docs:ci
      - run: pnpm tabs
      # PG-26. Asserts every library reaches the BROWSER as ESM, under npm
      # resolution. A stale CI-only alias sent the CJS build of
      # bigdecimal-string to the browser and took eleven demos down on the
      # live site; smoke passed throughout, because it aliases to source.
      - run: pnpm modules
      - run: pnpm smoke
      # The harness's own tests. A reporter that loses the failure is worse
      # than a missing check: the run still goes red, and the message sends
      # you looking in the wrong place. Five rejections rendered as the bare
      # string "Uncaught (in promise)" for two days because of that.
      - run: pnpm harness
      - run: pnpm interactions
      - run: pnpm geometry

  deploy:
    needs: verify-npm
    # The half that genuinely races pages.yml: both publish to GitHub Pages, so
    # they serialise. Not cancel-in-progress — a deploy that has started should
    # finish rather than leave Pages half-updated.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      PLAYGROUND_USE_NPM: '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm refresh:npm
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
