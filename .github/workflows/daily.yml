name: Daily portfolio refresh

on:
  schedule:
    # Run the npm-backed playground checks three times per day.
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# pages.yml deploys on every push to main. Without this, a scheduled run and a
# push can hand GitHub Pages two different builds at the same time and the
# winner is whichever finishes last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-npm:
    env:
      PLAYGROUND_USE_NPM: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm refresh:npm
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:npm
      - run: pnpm audit:npm
      - run: pnpm typecheck
      # DOCS-6. `markdown` needs no browser and catches a renderer that cannot
      # terminate, so it runs before anything launches Chrome. `docs:ci` builds
      # this repository alone and asserts every documentation tab renders a
      # published README — the check that was missing while all ten of them
      # showed an error banner on the live site. `tabs` drives both tab strips
      # with real keys.
      - run: pnpm markdown
      - run: pnpm build
      - run: pnpm docs:ci
      - run: pnpm tabs
      # PG-26. Asserts every library reaches the BROWSER as ESM, under npm
      # resolution. A stale CI-only alias sent the CJS build of
      # bigdecimal-string to the browser and took eleven demos down on the
      # live site; smoke passed throughout, because it aliases to source.
      - run: pnpm modules
      - run: pnpm smoke
      # The harness's own tests. A reporter that loses the failure is worse
      # than a missing check: the run still goes red, and the message sends
      # you looking in the wrong place. Five rejections rendered as the bare
      # string "Uncaught (in promise)" for two days because of that.
      - run: pnpm harness
      - run: pnpm interactions
      - run: pnpm geometry

  deploy:
    needs: verify-npm
    env:
      PLAYGROUND_USE_NPM: '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm refresh:npm
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
